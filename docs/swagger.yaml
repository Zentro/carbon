basePath: /
definitions:
  domain.ApiKey:
    properties:
      api_key_id:
        description: ID is the primary key of the API key
        type: integer
      api_key_key:
        description: Key is the actual API key string
        type: string
      api_key_role:
        description: Role specifies the role associated with the API key
        type: string
      api_key_user_id:
        description: USerID references the user who the API key belongs to
        type: integer
    required:
    - api_key_role
    - api_key_user_id
    type: object
  domain.Resource:
    properties:
      can_download:
        type: boolean
      current_files:
        items:
          $ref: '#/definitions/domain.ResourceFile'
        type: array
      custom_fields: {}
      description:
        type: string
      download_count:
        type: integer
      external_url:
        type: string
      icon_url:
        type: string
      last_update:
        type: integer
      license:
        type: string
      license_url:
        type: string
      rating_avg:
        type: number
      rating_count:
        type: integer
      rating_weighted:
        type: number
      resource_category_id:
        type: integer
      resource_date:
        type: integer
      resource_id:
        type: integer
      resource_state:
        type: string
      resource_type:
        type: string
      review_count:
        type: integer
      tag_line:
        type: string
      title:
        type: string
      update_count:
        type: integer
      version:
        type: string
      view_count:
        description: CurrentDownloadUrl string      `json:"current_download_url,omitempty"`
        type: integer
      view_url:
        type: string
    type: object
  domain.ResourceCategory:
    properties:
      description:
        type: string
      display_order:
        type: integer
      last_update:
        type: integer
      parent_category_id:
        type: integer
      resource_category_id:
        type: integer
      resource_count:
        type: integer
      title:
        type: string
    type: object
  domain.ResourceFile:
    properties:
      filename:
        type: string
      id:
        type: integer
      size:
        type: integer
    type: object
  domain.ResourceReview:
    properties:
      message:
        type: string
      rating:
        type: integer
      rating_date:
        type: integer
      rating_state:
        type: string
      resource_id:
        type: integer
      resource_rating_id:
        type: integer
      resource_version_id:
        type: integer
    type: object
  domain.ResourceVersion:
    properties:
      download_count:
        type: integer
      files:
        items:
          $ref: '#/definitions/domain.ResourceFile'
        type: array
      release_date:
        type: integer
      resource_id:
        type: integer
      resource_version_id:
        type: integer
      version_string:
        type: string
    type: object
  domain.Server:
    properties:
      description:
        type: string
      has_password:
        type: boolean
      icon_url:
        type: string
      ip:
        type: string
      is_visible:
        type: boolean
      max_clients:
        type: integer
      name:
        type: string
      owner_id:
        type: integer
      port:
        type: integer
      server_date:
        type: integer
      server_id:
        type: integer
      server_state:
        $ref: '#/definitions/domain.ServerStatus'
      version:
        type: string
    required:
    - description
    - has_password
    - ip
    - is_visible
    - max_clients
    - name
    - port
    - version
    type: object
  domain.ServerStatus:
    enum:
    - 1
    - 2
    - 3
    - 4
    type: integer
    x-enum-varnames:
    - StatusOnline
    - StatusOffline
    - StatusHidden
    - StatusCrashed
  domain.User:
    properties:
      avatar_urls: {}
      email:
        type: string
      gravatar:
        type: string
      is_staff:
        type: boolean
      profile_banner_urls: {}
      user_id:
        type: integer
      user_title:
        type: string
      username:
        type: string
      view_url:
        type: string
    type: object
  remote.RawUserAuthResponse:
    properties:
      login_token:
        type: string
      refresh_token:
        type: string
      tfa_providers:
        type: string
      tfa_required:
        type: boolean
      tfa_triggered:
        type: boolean
      user:
        $ref: '#/definitions/domain.User'
    type: object
  router.RequestError:
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
